<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">JSON Change Explainer architecture</title>
  <desc id="desc">JSON inputs and options feed a pure diff engine on the main thread, which emits a flat list of change events consumed by the change list, visual tree, and export builders.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .layer { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 14; }
      .accent { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; rx: 12; }
      .title { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .label { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #1e293b; }
      .muted { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #64748b; }
      .chip { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #1e40af; }
      .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .chipbox { fill: #ffffff; stroke: #bfdbfe; stroke-width: 1; rx: 8; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>

  <text x="60" y="34" class="title">JSON Change Explainer — runtime architecture</text>
  <text x="60" y="54" class="muted">Single static HTML file · all processing in the browser · no network calls</text>

  <!-- Inputs -->
  <rect x="60" y="80" width="230" height="64" class="box"/>
  <text x="76" y="106" class="label">Before JSON</text>
  <text x="76" y="126" class="muted">paste · upload · file://</text>

  <rect x="320" y="80" width="230" height="64" class="box"/>
  <text x="336" y="106" class="label">After JSON</text>
  <text x="336" y="126" class="muted">paste · upload · file://</text>

  <rect x="580" y="80" width="250" height="64" class="box"/>
  <text x="596" y="106" class="label">Comparison options</text>
  <text x="596" y="126" class="muted">strategy · key · ignored paths</text>

  <rect x="860" y="80" width="280" height="64" class="box"/>
  <text x="876" y="106" class="label">JSON.parse + validation</text>
  <text x="876" y="126" class="muted">syntax errors with line / column</text>

  <path d="M 175 144 L 175 190" class="arrow"/>
  <path d="M 435 144 L 435 190" class="arrow"/>
  <path d="M 705 144 L 705 190" class="arrow"/>
  <path d="M 1000 144 L 1000 190" class="arrow"/>

  <!-- Engine layer -->
  <rect x="60" y="190" width="1080" height="130" class="layer"/>
  <text x="80" y="218" class="title">Diff engine — pure functions, main thread</text>
  <text x="80" y="238" class="muted">compareAll walks both documents iteratively; alignArrays matches array items; no DOM access</text>

  <rect x="82" y="258" width="220" height="44" class="chipbox"/>
  <text x="96" y="285" class="chip">Iterative document walk</text>

  <rect x="320" y="258" width="220" height="44" class="chipbox"/>
  <text x="334" y="285" class="chip">Array alignment</text>

  <rect x="558" y="258" width="220" height="44" class="chipbox"/>
  <text x="572" y="285" class="chip">Ignored-path matching</text>

  <rect x="796" y="258" width="300" height="44" class="chipbox"/>
  <text x="810" y="285" class="chip">Human-readable descriptions</text>

  <path d="M 600 320 L 600 366" class="arrow"/>

  <!-- Events -->
  <rect x="60" y="366" width="1080" height="88" class="accent"/>
  <text x="80" y="394" class="title">Change event list — the only engine → UI contract</text>
  <text x="80" y="418" class="label">ADD · REMOVE · UPDATE · TYPE_CHANGE</text>
  <text x="80" y="438" class="muted">{ operation, path, property, index, oldValue, newValue, oldType, newType, description, identityKey, identityValue }</text>

  <path d="M 270 454 L 270 512" class="arrow"/>
  <path d="M 600 454 L 600 512" class="arrow"/>
  <path d="M 960 454 L 960 512" class="arrow"/>

  <!-- Consumers -->
  <rect x="60" y="512" width="380" height="118" class="box"/>
  <text x="78" y="540" class="title">Change explorer</text>
  <text x="78" y="564" class="muted">summary counts · search · filters</text>
  <text x="78" y="584" class="muted">group by operation / parent path</text>
  <text x="78" y="604" class="muted">pagination (100 per page)</text>

  <rect x="470" y="512" width="260" height="118" class="box"/>
  <text x="488" y="540" class="title">Visual diff tree</text>
  <text x="488" y="564" class="muted">after-document tree</text>
  <text x="488" y="584" class="muted">per-key add / remove /</text>
  <text x="488" y="604" class="muted">update / type-change styling</text>

  <rect x="760" y="512" width="380" height="118" class="box"/>
  <text x="778" y="540" class="title">Export builders</text>
  <text x="778" y="564" class="muted">descriptions · compact summary</text>
  <text x="778" y="584" class="muted">Markdown · CSV · JSON</text>
  <text x="778" y="604" class="muted">copy to clipboard · download</text>

  <text x="600" y="678" text-anchor="middle" class="muted">Browser only — localStorage holds the theme preference; documents never leave the machine.</text>
</svg>
